services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jeeai_dev}
      POSTGRES_USER: ${POSTGRES_USER:-jeeai_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jeeai_local} -d ${POSTGRES_DB:-jeeai_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
